<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROAS 점검 이력판</title>
<style>
:root{--bg:#f3f2ee;--surface:#fff;--surface-2:#f0eee8;--text:#1c1c1a;--muted:#5f5e58;--line:#d9d6cc;--wire:#aaa699;--accent:#2f5fd0;
--bad:#b53a09;--bad-soft:#fde6d6;--warn:#8f6508;--warn-soft:#f7eed9;--ok:#1b7a50;--ok-soft:#e1f2e8;--na:#6f6e68;--na-soft:#efeeea;--skip:#9b988f;--glyph-in:#fff;
--pass:#1b7a50;--path:#b53a09;--S:#8f6508;--J:#1b7a50;--M:#2f5fd0;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--surface:#1a1c20;--surface-2:#23262c;--text:#e9e8e3;--muted:#a9a8a1;--line:#33363d;--wire:#5a5e68;--accent:#86a8ff;
--bad:#ff8a4c;--bad-soft:#3e2318;--warn:#e3b35f;--warn-soft:#2e2717;--ok:#5fd09c;--ok-soft:#15261d;--na:#9a9993;--na-soft:#22242a;--skip:#6d7079;--glyph-in:#15161a;--pass:#5fd09c;--path:#ff8a4c;--S:#e3b35f;--J:#5fd09c;--M:#86a8ff;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#111214;--surface:#1a1c20;--surface-2:#23262c;--text:#e9e8e3;--muted:#a9a8a1;--line:#33363d;--wire:#5a5e68;--accent:#86a8ff;
--bad:#ff8a4c;--bad-soft:#3e2318;--warn:#e3b35f;--warn-soft:#2e2717;--ok:#5fd09c;--ok-soft:#15261d;--na:#9a9993;--na-soft:#22242a;--skip:#6d7079;--glyph-in:#15161a;--pass:#5fd09c;--path:#ff8a4c;--S:#e3b35f;--J:#5fd09c;--M:#86a8ff;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1440px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:21px;margin:0;line-height:1.3}h2{font-size:15.5px;margin:0 0 8px}h3{font-size:13.5px;margin:12px 0 4px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.ver{font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:middle;margin-left:6px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:12.5px;white-space:nowrap}
/* 상태 기호 — 모양 + 글자, 색은 덧붙임 */
.ic{width:14px;height:14px;flex:none;vertical-align:-2px;display:inline-block}
.ic.bad{color:var(--bad)}.ic.warn{color:var(--warn)}.ic.ok{color:var(--ok)}.ic.na{color:var(--na)}.ic.skip{color:var(--skip)}
.st{display:inline-flex;align-items:center;gap:4px;font-weight:800;white-space:nowrap}
.st.bad{color:var(--bad)}.st.warn{color:var(--warn)}.st.ok{color:var(--ok)}.st.na{color:var(--na)}.st.skip{color:var(--muted)}
.tag{font-size:11px;font-weight:800;padding:0 7px;border-radius:999px;border:1.5px solid var(--bad);color:var(--bad);white-space:nowrap}
.tag.day{border-style:dashed}
/* 판정 띠 */
.band{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:0;margin:12px 0 14px;padding:0}
.band>section{padding:13px 16px;min-width:0}.band>section+section{border-left:1px solid var(--line)}
.band .k{font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px}
.band .v{font-size:20px;font-weight:800;line-height:1.3;margin:2px 0 4px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px}.chain b{font-weight:800}.chain .ar{color:var(--muted)}
.dec{font-size:11px;font-weight:800;border:1px solid var(--line);border-radius:6px;padding:0 5px}
.todo-l{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:t}
.todo-l li{counter-increment:t;display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px;font-size:13px;line-height:1.45}
.todo-l li::before{content:counter(t);font-weight:800;font-size:12px;width:20px;height:20px;border-radius:50%;background:var(--text);color:var(--surface);display:grid;place-items:center}
.todo-l .wh{display:block;font-size:11.5px;color:var(--muted)}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:700;font-size:12.5px;text-align:left;text-decoration:underline;text-underline-offset:2px}
.gauge{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:6px 0 5px;gap:2px;background:var(--surface)}
.gauge i{display:block;height:100%;min-width:3px}
.f-bad{background:var(--bad)}.f-warn{background:var(--warn)}.f-ok{background:var(--ok)}
.f-na{background:radial-gradient(circle,var(--na) 1.2px,transparent 1.6px) 0 0/5px 5px,var(--na-soft)}
.f-skip{background:repeating-linear-gradient(135deg,var(--skip) 0 1.5px,transparent 1.5px 5px),var(--surface-2)}
.leg{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px}.leg span{display:inline-flex;align-items:center;gap:4px}
.gapl{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px}.gapl li{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding:3px 0}
.warnbox{margin-top:7px;padding:7px 9px;border-radius:9px;border:1.5px dashed var(--warn);font-size:12.5px;background:var(--warn-soft)}
@media(max-width:980px){.band{grid-template-columns:1fr}.band>section+section{border-left:0;border-top:1px solid var(--line)}}
/* 본문 배치 */
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 24px);overflow:auto}
@media(max-width:1179px){.main{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none;overflow:visible}}
/* 이력판: 줄 = 자리, 칸 = 날 · 주 */
.circ{padding:14px 16px 12px;min-width:0}
.circ>h2{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.kbd{font-size:11.5px;color:var(--muted);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:2px 0 10px}.legend span{display:inline-flex;align-items:center;gap:5px}
.nrs{display:inline-block;width:14px;height:14px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--skip) 0 1.5px,transparent 1.5px 5px),var(--surface-2)}
.pathk{display:inline-block;width:5px;height:14px;background:var(--bad)}.stopk{display:inline-block;width:16px;height:12px;border:3px double var(--bad);border-radius:3px}
.gscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.gt{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;min-width:calc(var(--namew) + var(--hn) * var(--hcw) + var(--todayw));font-size:13px;--namew:200px;--todayw:300px}
.gt th,.gt td{border-bottom:1px solid var(--line);padding:0;vertical-align:middle;background:var(--surface)}
.gt thead th{font-size:11.5px;color:var(--muted);font-weight:700;padding:6px 4px;position:sticky;top:0;z-index:2}
.gt .nmc{position:sticky;left:0;z-index:1;width:var(--namew);min-width:var(--namew);text-align:left;border-right:1px solid var(--line)}
.gt .hc{width:var(--hcw);min-width:var(--hcw);text-align:center}.gt thead .hc{white-space:nowrap;font-size:10.5px;padding:6px 0}
.gt .tc{position:sticky;right:0;z-index:1;min-width:var(--todayw);text-align:left;border-left:2px solid var(--text);padding:5px 8px}
.gt thead .tc{color:var(--text)}
.gt td.nr{background:repeating-linear-gradient(135deg,var(--skip) 0 1.5px,transparent 1.5px 5px),var(--surface-2)}
.hg{display:inline-grid;place-items:center}.hg.skip{opacity:.55}
.rb{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;width:100%;min-height:32px;border:0;background:none;text-align:left;padding:5px 8px;cursor:pointer;font:inherit;color:inherit}
.rb .nm{font-weight:700}.rb .cvn{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:700}.rb .cvn.thin{color:var(--warn)}
.rb[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--accent)}
tr.quiet .rb .nm{font-weight:500;color:var(--muted)}
tr.path .nmc{box-shadow:inset 5px 0 0 var(--bad)}
tr.stop th,tr.stop td{background:var(--bad-soft)}tr.stop .nmc{box-shadow:inset 5px 0 0 var(--bad)}tr.stop .rb{outline:3px double var(--bad);outline-offset:-4px}
.stoptag{font-size:10.5px;font-weight:800;color:var(--glyph-in);background:var(--bad);border-radius:5px;padding:0 6px}
.sametag{font-size:10.5px;font-weight:800;color:var(--bad);border:1.5px solid var(--bad);border-radius:5px;padding:0 5px}
tr.gh th,tr.gh td{background:var(--surface-2);border-bottom:1px solid var(--line)}tr.gh .rb{min-height:32px}tr.gh th>.st{display:inline-flex;padding:6px 8px}
tr.gh.hit .nmc{box-shadow:inset 5px 0 0 var(--bad)}
.tc .tline{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;line-height:1.4;white-space:nowrap}.tc .tx{min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis}.tc .lts{flex:none;flex-wrap:nowrap}.tc .streak{font-size:11.5px;color:var(--bad);border:1.5px solid var(--bad);border-radius:999px;padding:0 6px}
.tc .tl2{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:2px}.tc[data-id]{cursor:pointer}
.lts{display:flex;flex-wrap:wrap;gap:2px}.lt{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:4px;position:relative}
.lt:hover{background:var(--surface-2)}.lt.x::after{content:"+";position:absolute;right:-3px;top:-6px;font-size:10px;font-weight:900;color:var(--text)}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);position:relative}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--text)}.bar i.on{background:var(--bad)}
.spark{display:inline-flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}.spark svg{display:block}
@media(max-width:759px){.circ{padding:12px}.gt{--namew:118px;--todayw:168px;font-size:12.5px}.rb{padding:5px 6px}.rb .cvn{margin-left:0}.tc .tline{flex-wrap:wrap;white-space:normal}.tc .tx{flex-basis:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tc .lts{display:none}}
/* 진행 순서: 스킬의 카드 흐름 */
.tab .n:empty{display:none}
.fmap{display:flex;align-items:stretch;margin:6px 0 14px;min-width:0}
.fmap .far{flex:none;width:22px;height:16px;align-self:center;color:var(--muted)}
.fbx{flex:1 1 0;min-width:0;align-self:center;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:7px 9px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.fbx:hover{background:var(--surface-2)}
.fbx .no{font-size:11px;font-weight:800;color:var(--muted)}.fbx .tt{font-weight:800;font-size:13.5px;line-height:1.3}
.fbx .trc{display:flex;gap:4px;align-items:flex-start;font-size:11.5px;line-height:1.35}.fbx .trc .st{flex:none;padding-top:1px}
.fbx.unseen,.fc.unseen{border-style:dashed}
.fbx.path,.fc.path{box-shadow:inset 0 4px 0 var(--bad)}
.fbx.stop{border:3px double var(--bad);background:var(--bad-soft)}.fc.stop{border:3px double var(--bad)}
.ffork{flex:1.15 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;padding:4px 6px;border:1.5px dashed var(--wire);border-radius:12px}
.ffork .fk{font-size:11px;line-height:1.3}
.fcards{display:flex;flex-direction:column;gap:10px}
.ffk{display:flex;flex-direction:column;gap:10px;padding-left:10px;border-left:2px dashed var(--wire)}
.fc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);min-width:0}
.fc h3{margin:0 0 4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:14.5px}
.fc .fno{font-size:11.5px;font-weight:800;color:var(--glyph-in);background:var(--text);border-radius:6px;padding:0 6px}
.pathtag{font-size:10.5px;font-weight:800;color:var(--bad);border:1.5px solid var(--bad);border-radius:5px;padding:0 5px}
.fq{margin:0 0 2px;font-weight:700}.ftr{margin:0 0 4px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 14px;margin-top:4px}
.fgrid h4{font-size:12px;color:var(--muted);margin:6px 0 2px}.fsec>summary{list-style:none;cursor:pointer}.fsec>summary::-webkit-details-marker{display:none}.fsec>summary h4{display:inline}.fsec>summary h4::after{content:" ▾"}.fsec:not([open])>summary h4::after{content:" ▸ 펼치기"}
.fgrid ul{margin:0;padding-left:17px;font-size:12.5px;line-height:1.5}.fgrid li{margin:1px 0}
.fbr{list-style:none;padding-left:0!important}.fbr li{border-top:1px dashed var(--line);padding:4px 0 4px 8px;display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
.fbr li.on{border-left:4px double var(--bad);background:var(--bad-soft);border-radius:0 6px 6px 0}.fbr .cnd{font-weight:700}.fbr .to{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.fbund{display:flex;flex-direction:column;gap:6px;margin-top:6px}.fb{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px}.fb.on{border:3px double var(--bad)}
.chipb.stopc{border:3px double var(--bad)}
.fother{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}.fother>summary{cursor:pointer;font-weight:800}
tr.flash .rb{box-shadow:inset 0 0 0 3px var(--accent);background:var(--surface-2)}
@media(max-width:860px){.fgrid{grid-template-columns:1fr}}
@media(max-width:759px){.fmap{flex-direction:column;gap:0}.fmap .far{transform:rotate(90deg);margin:3px 0 3px 18px}.fbx{flex:none;align-self:stretch}.ffork{flex:none}.ffk{padding-left:6px}}
/* 옆 패널 · 서랍 */
.panel h2{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.iss{border:1px solid var(--line);border-left:5px solid var(--skip);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--surface)}
.iss.bad{border-left-color:var(--bad)}.iss.warn{border-left-color:var(--warn);border-left-style:double;border-left-width:6px}.iss.ok{border-left-color:var(--ok)}.iss.na,.iss.skip{border-left-style:dashed}
.iss .w2{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center}.iss .q{font-weight:800}.iss .tg{font-size:12px;color:var(--muted)}
.iss .ev{font-size:12.5px;margin-top:3px}.iss .td{font-size:12.5px;font-weight:700;margin-top:3px}.iss .why{font-size:12px;margin-top:4px;color:var(--muted)}
.iss.flash{box-shadow:0 0 0 3px var(--accent)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.chipb{font-size:12px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:2px 8px;cursor:pointer}
.xbtn{margin-left:auto}
.hyp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.hyp.r1{border:3px double var(--bad)}
@media(max-width:1179px){
 #detail{display:none;position:fixed;z-index:20;top:0;right:0;bottom:0;width:min(440px,100%);overflow:auto;border-radius:0;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
 #detail.open{display:block}
 #detail .xbtn{position:sticky;top:0}
 #trace{order:2}
}
@media(max-width:759px){#detail{top:auto;left:0;width:100%;max-height:82vh;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.3)}}
/* 탭: 체크리스트 · 할 일 · 빈 곳 */
.tabs{margin-top:14px}
.tablist{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 12px;cursor:pointer;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text)}
.tab .n{font-size:11.5px;font-weight:800;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--surface-2)}
.tabpanel[hidden]{display:none}
.issues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}@media(max-width:860px){.issues{grid-template-columns:1fr}}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12.5px;display:inline-flex;gap:4px;align-items:center}
.fbtn[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}.fbtn[aria-pressed="true"] .ic{color:var(--surface)}
.grp{border-top:1px solid var(--line)}.grp>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:8px 2px}.grp>summary::-webkit-details-marker{display:none}
.grp>summary h3{margin:0;font-size:13px}.grp>summary::after{content:"펼치기";margin-left:auto;font-size:11.5px;color:var(--muted)}.grp[open]>summary::after{content:"접기"}.grp>.ck{margin-left:24px}
@media(max-width:640px){.grp>.ck{margin-left:4px}}
.ck{border-bottom:1px solid var(--line)}.ck>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:18px 96px minmax(0,1fr) auto 14px;gap:8px;align-items:baseline;padding:6px 2px;font-size:13px}
.ck>summary::-webkit-details-marker{display:none}.ck>summary .nd{font-size:11.5px;color:var(--muted);white-space:nowrap}
.ck>summary::after{content:"＋";color:var(--muted);font-size:12px}.ck[open]>summary::after{content:"－"}
.ck .body{padding:0 2px 9px 130px;font-size:12.5px}.ck .body p{margin:2px 0}
.ck.done>summary .qx{color:var(--muted)}
@media(max-width:640px){.ck>summary{grid-template-columns:18px minmax(0,1fr) 14px}.ck>summary .st{grid-column:2;grid-row:1}.ck>summary .qx{grid-column:2;grid-row:2}.ck>summary::after{grid-column:3;grid-row:1}.ck>summary .nd{display:none}.ck .body{padding-left:2px}}
/* 체크리스트 진행 */
.box{display:inline-grid;place-items:center;width:16px;height:16px;border:1.6px solid var(--muted);border-radius:4px;font-size:11px;font-weight:900;line-height:1;flex:none;align-self:center}
.box.on{background:var(--text);border-color:var(--text);color:var(--surface)}
.prog{height:10px;border-radius:5px;overflow:hidden;margin:6px 0 4px;background:repeating-linear-gradient(135deg,var(--skip) 0 1.5px,transparent 1.5px 5px),var(--surface-2)}.prog i{display:block;height:100%;background:var(--text)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px;display:inline-flex;gap:5px;align-items:center;line-height:1.3}
.btn:hover{border-color:var(--muted)}.btn.pri{background:var(--text);color:var(--surface);border-color:var(--text);font-weight:800}.btn.pri .ic{color:var(--surface)}
.btn[aria-pressed="true"]{border:2px solid var(--text);font-weight:800;background:var(--surface-2)}

<script>
(function(){
const R=JSON.parse(document.getElementById('data').textContent),CAT=JSON.parse(document.getElementById('cat').textContent);
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(x,d=0)=>x==null?'—':(x*100).toFixed(d)+'%',won=x=>x==null?'—':Math.round(x).toLocaleString('ko-KR');
const chg=x=>x==null?'—':Math.abs(x)<0.005?'변화 없음':(x>0?'+':'')+(x*100).toFixed(1)+'%';
const SN={bad:'이상',warn:'확인 필요',ok:'정상',na:'못 봄',skip:'안 봄'},ORD={bad:0,warn:1,ok:2,na:3,skip:4},STS=['bad','warn','ok','na','skip'];
const ic=(s,z)=>`<svg class="ic ${s}" aria-hidden="true"${z?` style="width:${z}px;height:${z}px"`:''}><use href="#i-${s}"/></svg>`;
const stx=s=>`<span class="st ${s}">${ic(s)}${SN[s]}</span>`;
const R_=R.rhythm==='weekly'?'W':'D';
const LANES=[
 {id:'S',name:'시장',lens:'거시',gate:'업종도 같이 떨어졌나?',nodes:[['S1','시즌 상황'],['S2','수요 상황'],['S3','경쟁 상황'],['S4','업종 흐름'],['S5','플랫폼']]},
 {id:'J',name:'자사',lens:'웹 상태',gate:'자사몰 전체도 떨어졌나?',nodes:[['J1','도착'],['J2','랜딩'],['J3','상품'],['J4','장바구니'],['J5','결제'],['J6','구매 완료']],rail:['JT','측정 태그','단계마다 메타로 이벤트가 나가나']},
 {id:'M',name:'매체',lens:'메타 구조',gate:'메타 안 어디에 몰렸나?',nodes:[['M1','계정'],['M2','캠페인'],['M3','광고세트'],['M4','광고(소재)']],rail:['MX','단면','지면 · 기기 · 연령 · 소구점으로 가로질러 묶기']}];
// 판정 엔진 · 체크리스트가 쓰는 예전 자리 이름 → 화면 이름

const disp=s=>String(s==null?'':s).replace(/시장 › 달력( · 시즌)?/g,'시장 › 시즌 상황').replace(/시장 › 경매( · 경쟁)?/g,'시장 › 경쟁 상황').replace(/시장 › 수요(?! 상황)/g,'시장 › 수요 상황');
const LINKS={M4:[['J1','연결 주소 — 광고가 보내는 사이트 주소']],J1:[['M4','연결 주소 — 이 주소로 보내는 광고']],JT:[['M1','전환 신호 — 픽셀 · 서버 이벤트가 계정 학습에 쓰인다']],M1:[['JT','전환 신호 — 사이트 측정 태그'],['J3','카탈로그 — 상품 정보']],J3:[['M1','카탈로그 — 메타 카탈로그 상품']],S3:[['M3','경쟁 — 광고세트의 타겟 · 입찰']],M3:[['S3','경쟁 — 시장의 노출 단가']]};
const NAME={G:'신호판'},SHORT={G:'신호판'};LANES.forEach(l=>{l.nodes.forEach(([i,n])=>{NAME[i]=l.name+' › '+n;SHORT[i]=n});if(l.rail){NAME[l.rail[0]]=l.name+' › '+l.rail[1];SHORT[l.rail[0]]=l.rail[1]}});
const ORDER=['G'].concat(...LANES.map(l=>l.nodes.map(n=>n[0]).concat(l.rail?[l.rail[0]]:[])));
const FN={cpm:'노출 단가',ctr:'클릭률',cvr:'구매 전환율',aov:'객단가'};
// ── 체크리스트(이번 리듬)와 실행 결과를 맞춘다: 램프 = 체크리스트 항목
const norm=s=>s.replace(/\s/g,'');
const lamps={};const used=new Set();
CAT.filter(c=>c.r===R_).forEach(c=>{
 let hits=R.checks.map((x,i)=>[x,i]).filter(([x])=>x.node===c.node&&norm(x.q)===norm(c.q));
 if(!hits.length&&c.basis==='어제와 같나'){hits=R.checks.map((x,i)=>[x,i]).filter(([x])=>x.node===c.node&&x.q==='어제와 같나?').map(([x,i])=>[Object.assign({},x,{q:c.q}),i])}
 if(!hits.length&&c.node==='G'&&c.q.startsWith('업종도'))hits=R.checks.map((x,i)=>[x,i]).filter(([x])=>x.node==='S4'&&x.q.startsWith('같은 업종'));
 hits.forEach(([,i])=>used.add(i));
 if(!hits.length&&c.node==='G'&&c.q.startsWith('어느 숫자가')&&(R.signal||R.factors)){const f=(R.signal||{}).factors||R.factors;const w=Object.entries(f).filter(([k,v])=>v.effect!=null).sort((a,b)=>a[1].effect-b[1].effect)[0];hits=[[{node:'G',where:'신호판',q:c.q,status:'ok',status_name:'정상',evidence:Object.entries(f).map(([k,v])=>FN[k]+' '+chg(v.change)).join(' · ')+(w?` ← ${FN[w[0]]} 몫이 가장 크다`:''),todo:'',basis:c.basis,target:'',urgency:''}]]}
 const rs=hits.map(h=>h[0]);const st=rs.length?rs.map(x=>x.status).sort((a,b)=>ORD[a]-ORD[b])[0]:'skip';
 (lamps[c.node]=lamps[c.node]||[]).push({c,rs,st});});
R.checks.forEach((x,i)=>{if(used.has(i)||x.q==='어제와 같나?')return;(lamps[x.node]=lamps[x.node]||[]).push({c:{node:x.node,q:x.q,where:'',bad:'',todo:x.todo,basis:x.basis,extra:true},rs:[x],st:x.status})});
Object.keys(lamps).forEach(k=>lamps[k].forEach((l,i)=>{l.id=k;l.i=i;l.auto=l.st;l.key=k+'|'+norm(l.c.q)+(l.c.extra?'|+':'')}));
const ALL=ORDER.flatMap(k=>lamps[k]||[]);ALL.forEach((l,g)=>l.g=g);
const autoSeen=l=>l.auto==='bad'||l.auto==='warn'||l.auto==='ok';
// ── 체크리스트 기록(이 브라우저에 저장): 자동 판정은 '확인', 안 본 · 못 본 점검은 '직접' 기록
const SKEY='roas-check:'+R.advertiser+':'+R.date+':'+R.rhythm;let REC={},SAVED=true;
try{REC=JSON.parse(localStorage.getItem(SKEY)||'{}')||{}}catch(e){SAVED=false;REC={}}
const save=()=>{try{localStorage.setItem(SKEY,JSON.stringify(REC));SAVED=true}catch(e){SAVED=false}};
function applyRec(){ALL.forEach(l=>{const r=REC[l.key];l.done=!!(r&&r.st);l.st=l.done?r.st:l.auto;l.how=l.done?r.how:'';l.memo=r&&r.memo||''})}
applyRec();
const tally=ls=>{const t={bad:0,warn:0,ok:0,na:0,skip:0};ls.forEach(l=>t[l.st]++);return t};
const cover=ids=>{const ls=ids.flatMap(k=>lamps[k]||[]);const t=tally(ls);return {n:ls.length,seen:t.bad+t.warn+t.ok,done:ls.filter(l=>l.done).length,t}};
const worst=k=>{const t=tally(lamps[k]||[]);return ['bad','warn','ok','na'].find(s=>t[s])||'skip'};
const tallyTxt=t=>STS.filter(s=>t[s]).map(s=>`${SN[s]} ${t[s]}`).join(', ');
const gaugeHtml=t=>`<div class="gauge" aria-hidden="true">${STS.filter(s=>t[s]).map(s=>`<i class="f-${s}" style="flex:${t[s]}"></i>`).join('')}</div>`;
const OFF=R.sources.filter(x=>!x.on);
const missing=id=>OFF.filter(s=>s.unlocks.includes(id)).map(s=>s.name);
// ── 관문과 원인 자리
const L=R.location,trail=L&&L.trail||[];const find=(n,q)=>R.checks.find(x=>x.node===n&&x.q.startsWith(q));
const LV={account:'M1',campaign:'M2',adset:'M3',ad:'M4'};
const HYP=R.hypotheses||[];
function hypNodes(h){if(!h)return [];let lane=null;const out=[];
 const hit=(p,[i,n])=>p===n||p.startsWith(n)||n.startsWith(p)||(ALIAS[i]||[]).some(a=>p.startsWith(a));
 // '시장 › 경매 · 경쟁 · 매체 › 광고세트'처럼 레이어가 바뀌는 곳마다 ' › '가 다시 나온다
 h.where.split(' · ').forEach(tok=>{let p=tok;if(tok.includes(' › ')){const [ln,rest]=tok.split(' › ');lane=LANES.find(l=>l.name===ln)||null;p=rest}
  if(!lane)return;const m=lane.nodes.concat(lane.rail?[lane.rail]:[]).find(x=>hit(p,x));if(m&&!out.includes(m[0]))out.push(m[0])});
 return out}
let stopNode=null,PATH=[];
if(R_==='D'&&L&&L.stop){stopNode=LV[L.stop.level]||null;const ms=['M1','M2','M3','M4'];if(stopNode)PATH=['G'].concat(ms.slice(0,ms.indexOf(stopNode)+1))}
if(R_==='W'&&HYP[0]){const hn=hypNodes(HYP[0]);stopNode=hn[0]||null;PATH=['G'].concat(hn)}
function gate(lid){const lane=LANES.find(l=>l.id===lid);
 if(R_==='W'){const h=HYP.find(h=>h.where.indexOf(lane.name)===0);
  if(h)return h.rank===1?{st:'hit',txt:'걸림 · 1순위 가설',ev:`${h.name} · 근거 ${h.strength}`}:{st:'lean',txt:`${h.rank}순위 가설 · 근거 ${h.strength}`,ev:h.name};
  const ids=lane.nodes.map(n=>n[0]);const cv=cover(ids);
  if(!cv.seen)return {st:'na',txt:'못 봄 · 이 레이어 원인을 지울 수 없다',ev:`점검 ${cv.n}개 중 본 것 없음`};
  return cv.t.bad||cv.t.warn?{st:'lean',txt:'흐름에 이상 있음',ev:tallyTxt(cv.t)}:{st:'pass',txt:'통과 · 흐름 이상 없음',ev:`점검 ${cv.n}개 중 ${cv.seen}개 봄`}}
 if(lid==='S'){const c=find('S4','같은 업종');if(!c||c.status==='na')return {st:'na',txt:'못 봄 · 시장 원인을 지울 수 없다',ev:'업종 묶음 없음'};return c.status==='bad'?{st:'hit',txt:'걸림 · 시장 원인 가능',ev:c.evidence}:{st:'pass',txt:'통과 · 우리만의 일',ev:c.evidence}}
 if(lid==='J'){const c=find('G','자사몰 전체');if(!c||c.status==='na')return {st:'na',txt:'못 봄 · 자사 원인을 지울 수 없다',ev:'자사몰 매출 없음'};return c.status!=='ok'?{st:'hit',txt:'걸림 · 자사 원인 가능',ev:c.evidence}:{st:'pass',txt:'통과 · 메타 쪽이 큼',ev:c.evidence}}
 if(lid==='M'){if(!trail.length)return {st:'na',txt:'못 봄',ev:''};return {st:'hit',txt:'걸림 · 몰림을 따라 내려감',ev:trail.map(t=>`${t.unit.name} ${t.decision.split(' ')[0]}`).join(' → ')}}}
const GST={hit:['bad','걸림'],pass:['ok','통과'],lean:['warn','기울어짐'],na:['na','못 봄']};
let sel=null;
// ── 할 일(같은 할 일은 묶는다) — 자동 판정 + 체크리스트에서 직접 기록한 이상 · 확인 필요
const URG={'즉시':0,'당일':1};
function actions(){const m=new Map();
 ALL.filter(l=>l.id!=='G'&&(l.st==='bad'||l.st==='warn')).forEach(l=>{
  const xs=l.how==='직접'?[{node:l.id,where:NAME[l.id],q:l.c.q,target:'',status:l.st,evidence:'체크리스트에서 직접 기록'+(l.memo?' — '+l.memo:''),todo:l.c.todo||'',basis:l.c.basis,urgency:''}]:l.rs.filter(x=>x.status==='bad'||x.status==='warn');
  xs.forEach(x=>{const k=x.todo||x.q;const o=m.get(k)||{todo:k,st:x.status,urg:x.urgency||'',items:[]};o.items.push(x);if(ORD[x.status]<ORD[o.st])o.st=x.status;if((URG[x.urgency]??9)<(URG[o.urg]??9))o.urg=x.urgency;m.set(k,o)})});
 return [...m.values()].sort((a,b)=>(URG[a.urg]??9)-(URG[b.urg]??9)||ORD[a.st]-ORD[b.st])}
let ACT=actions();
const pgap=()=>PATH.filter(k=>R_==='D'||k!=='G').flatMap(k=>(lamps[k]||[]).filter(l=>l.st==='skip'||l.st==='na'));
const streak=(()=>{const w=R.weeks||[];let n=0;for(let i=0;i<w.length-1&&w[i].roas<w[i+1].roas;i++)n++;return n})();
// ── 체크리스트 진행 순서: 원인 길의 빈 점검 → 자동 이상 · 확인 필요 → 나머지 빈 점검(바깥 → 안) → 자동 정상
const LATER=new Set();
function prio(l){if(!autoSeen(l)&&PATH.includes(l.id)&&(R_==='D'||l.id!=='G'))return 0;if(l.auto==='bad'||l.auto==='warn')return 1;if(!autoSeen(l))return 2;return 3}
const QUEUE=ALL.slice().sort((a,b)=>prio(a)-prio(b)||a.g-b.g);
function nextLamp(){const left=QUEUE.filter(l=>!l.done);if(!left.length)return null;const n=left.find(l=>!LATER.has(l.key));if(n)return n;LATER.clear();return left[0]}
function record(l,st){const r=REC[l.key]||{};r.st=st;r.how=autoSeen(l)&&st===l.auto?'확인':'직접';r.at=new Date().toISOString();REC[l.key]=r;LATER.delete(l.key);save()}

function recControls(l,ctx){const opts=['bad','warn','ok','na'];const lab=SN;
 const head=l.done?`<span class="done-t"><span class="box on" aria-hidden="true">✓</span> 채움 · ${stx(l.st)} · ${l.how==='확인'?'자동 판정 확인':'직접 기록'}</span>`:autoSeen(l)?`<span class="lab">자동 판정이 맞나?</span>`:`<span class="lab">직접 본 결과</span>`;
 const pri=autoSeen(l)&&!l.done?`<button class="btn pri" type="button" data-rec="${l.g}:${l.auto}">${ic(l.auto)}맞다 — ${SN[l.auto]}로 확인</button><span class="lab" style="width:auto">다르게 기록</span>`:'';
 return `<div class="rec" role="group" aria-label="${esc(l.c.q)} 기록">${head}${pri}${opts.filter(s=>!(autoSeen(l)&&!l.done&&s===l.auto)).map(s=>`<button class="btn" type="button" data-rec="${l.g}:${s}" aria-pressed="${l.done&&l.st===s}">${ic(s)}${s==='na'?'못 봄(볼 수 없음)':lab[s]}</button>`).join('')}${l.done?`<button class="btn" type="button" data-rec="${l.g}:clear">되돌리기</button>`:''}${ctx==='run'?'':`<input class="memo" type="text" data-memo="${l.g}" value="${esc(l.memo)}" placeholder="메모(선택)" aria-label="${esc(l.c.q)} 메모">`}</div>`}
// ── 판정 띠

  if(k==='W1'&&TOPF){const f=R.factors[TOPF];run=`가장 크게 끌어내린 숫자: ${FN[TOPF]} ${chg(f.change)}${FAC[1]&&FAC[1][1].effect<0?` · 다음: ${FN[FAC[1][0]]} ${chg(FAC[1][1].change)}`:''}`}
  if(k==='W2'&&HYP.length)run=HYP.map(h=>`${h.rank}. ${h.name}(${h.strength})`).join(' · ');}
 const lst=xs=>`<ul>${xs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
 const bund=c.bundles?`<div class="fbund">${BUND.map(([f,nm,qs,ids])=>{const top=live&&f&&f===TOPF,hy=live&&ids.includes(stopNode);return `<div class="fb ${top?'on':''}"><b>${esc(nm)}</b>${top?' <span class="tag">가장 크게 끌어내린 숫자</span>':''}${hy?' <span class="tag">1순위 가설 자리</span>':''}<div class="small">${esc(qs)}</div><div class="links">${ids.map(i=>rowBtn(i,live)).join('')}</div></div>`}).join('')}</div>`:'';
 const brs=c.br.length?`<ul class="fbr">${c.br.map(b=>{const on=live&&b.on&&b.on();return `<li class="${on?'on':''}">${on?'<span class="tag">이번 실행</span> ':''}<span class="cnd">${esc(b.c)}</span> <span class="to">→ ${b.to.map(t=>toBtn(rk,t)).join(' ')}${b.row?rowBtn(b.row,live):''}</span>${b.n?`<span class="small muted">${esc(b.n)}</span>`:''}</li>`}).join('')}</ul>`:`<div class="links"><button class="chipb" type="button" data-tabgo="todo">할 일 탭 보기</button><button class="chipb" type="button" data-tabgo="check">체크리스트 탭 보기</button></div>`;
 return `<section class="fc ${tr?(tr.stop?'stop':'')+(tr.path?' path':'')+(tr.pass?'':' unseen'):''}" id="fc-${rk}-${k}" aria-labelledby="fh-${rk}-${k}">
  <h3 id="fh-${rk}-${k}" tabindex="-1"><span class="fno">${esc(CNAME(k))}</span>${esc(c.t)}${tr&&tr.st?` <span class="st ${tr.st}">${ic(tr.st)}${SN[tr.st]}</span>`:''}${tr&&tr.stop?`<span class="stoptag">${R_==='D'?'원인 자리':'1순위 가설'}</span>`:''}${tr&&tr.has&&!tr.stop?`<span class="pathtag">${R_==='D'?'원인 자리':'가설 자리'} 점검 있음</span>`:tr&&tr.path&&!tr.stop?'<span class="pathtag">원인 길</span>':''}</h3>
  <p class="fq"><span class="muted small">묻는 것</span> ${esc(c.q)}</p>
  ${tr?`<p class="ftr small"><b>이번 실행</b> ${esc(tr.tx)}${run?` · ${esc(run)}`:''}</p>`:''}
  ${nodes.length?`<div class="links"><span class="small muted">이력판 줄</span>${nodes.map(i=>rowBtn(i,live)).join('')}</div>`:''}
  <div class="fgrid"><details class="fsec"${FOLD()?'':' open'}><summary><h4>${c.out?'정리할 것':'사용자에게 받는 것 · 보는 곳'}</h4></summary>${lst(c.ask)}${bund}</details><details class="fsec"${FOLD()?'':' open'}><summary><h4>${c.out?'결과물':'판정'}</h4></summary>${lst(c.judge)}</details><div><h4>다음 카드로</h4>${brs}</div></div></section>`}
function fcards(rk){const F=FLOW[rk];return F.shape.map(col=>col.length>1?`<div class="ffk"><p class="small muted" style="margin:0 0 6px">${col.map(CNAME).join(' · ')} — 원인 자리가 나오면 그 자리를 이 셋에서 본다. 카드 1의 숫자가 가리키면 앞당긴다.</p>${col.map(k=>fcard(rk,k)).join('')}</div>`:fcard(rk,col[0])).join('')}
let FOTHER=false;const FOLD=()=>innerWidth<760;
function flowP(){const oth=R_==='D'?'W':'D',F=FLOW[R_],O=FLOW[oth];
 $('#p-flow').innerHTML=`<h2>진행 순서 — ${F.name} <span class="muted small">roas-check 스킬이 대화로 점검을 진행하는 순서. ${esc(F.lead)}</span></h2>
 <div class="legend"><span><span class="st ok">${ic('ok')}</span>지나감(본 점검 있음) — 기호는 그 카드 자리의 가장 나쁜 상태</span><span><span class="st na">${ic('na')}</span>못 봄</span><span><span class="st skip">${ic('skip')}</span>안 봄</span><span><i class="pathk"></i>원인 길</span><span><i class="stopk"></i>${R_==='D'?'원인 자리':'1순위 가설'}</span><span>점선 테두리 = 이번 실행이 지나지 않은 카드</span></div>
 ${fmap(R_)}<div class="fcards">${fcards(R_)}</div>
 <details class="fother"${FOTHER?' open':''}><summary>${O.name} 진행 순서도 보기 — ${O.shape.flat().map(CNAME).join(' → ')}</summary><p class="small muted">이번 화면은 ${F.name} 실행이라 ${O.name} 카드에는 실행 자취를 표시하지 않는다.</p>${fmap(oth)}<div class="fcards">${fcards(oth)}</div></details>`;
 $$('#p-flow .fmap').forEach(m=>{const b=m.querySelector('[data-fnav]');if(b)b.tabIndex=0})}
function goRow(id,from){const gid=id.startsWith('gate:');const t=document.getElementById(gid?'g-'+id.slice(5):'n-'+id);if(!t)return;
 pick(id,{from:t,keep:true});const tr=t.closest('tr');if(tr){tr.classList.add('flash');setTimeout(()=>tr.classList.remove('flash'),1600)}
 if(!drawer()){t.scrollIntoView({block:'center'});t.focus()}else{opener=from||opener}
 $('#live').textContent=`이력판: ${gid?LANES.find(l=>l.id===id.slice(5)).name+' 관문':NAME[id]} 줄을 열었다`}
function goCard(key){const [rk]=key.split('-');if(rk!==R_){const d=$('#p-flow .fother');if(d&&!d.open){d.open=true;FOTHER=true}}
 const h=document.getElementById('fh-'+key);if(h){h.scrollIntoView({block:'start'});h.focus()}}
function fnav(e){const t=e.target.closest('[data-fnav]');if(!t)return;const all=Array.from(t.closest('.fmap').querySelectorAll('[data-fnav]')),i=all.indexOf(t);let nx=null;
 if(e.key==='ArrowRight'||e.key==='ArrowDown')nx=all[i+1];else if(e.key==='ArrowLeft'||e.key==='ArrowUp')nx=all[i-1];else if(e.key==='Home')nx=all[0];else if(e.key==='End')nx=all[all.length-1];else return;
 e.preventDefault();if(nx){all.forEach(x=>x.tabIndex=-1);nx.tabIndex=0;nx.focus()}}
// ── 기록 내려받기
function exportMd(){const c=tally(ALL),done=ALL.filter(l=>l.done).length;
 let md=`# ROAS 점검 기록 — ${R.advertiser} · ${R.date} · ${R_==='D'?'데일리':'위클리'}\n\n체크리스트 ${done}/${ALL.length} 채움 · ${tallyTxt(c)}\n\n`;
 ORDER.forEach(k=>{const ls=lamps[k]||[];if(!ls.length)return;md+=`## ${NAME[k]}\n`;ls.forEach(l=>{md+=`- [${l.done?'x':' '}] ${SN[l.st]} · ${l.c.q}${l.done?` — ${l.how==='확인'?'자동 판정 확인':'직접 기록'}`:' — 남음'}${l.rs[0]?` · 근거: ${l.rs.map(x=>x.evidence).join(' / ')}`:''}${l.memo?` · 메모: ${l.memo}`:''}\n`});md+='\n'});
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download=`ROAS_점검기록_${R.advertiser}_${R.date}_${R_==='D'?'데일리':'위클리'}.md`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
// ── 다시 그리기(기록 뒤): 포커스를 이어 준다
function refresh(focus){applyRec();ACT=actions();band();grid();detail();panels();
 if(focus){const el=typeof focus==='string'?$(focus):focus;if(el)el.focus({preventScroll:false})}}
function bindGo(root){$$(root+' [data-go]').forEach(b=>b.onclick=()=>{const k=b.dataset.go;
 if(k==='check'){showTab('check');const t=$('#run-q');t.scrollIntoView({block:'center'});t.focus();return}
 showTab('todo');const t=k==='todo-gap'?$('#todo-gap'):$('#tab-todo');t.scrollIntoView({block:'start'});t.focus()})}
document.addEventListener('click',e=>{
 const r=e.target.closest('[data-rec]');
 if(r){const [g,st]=r.dataset.rec.split(':');const l=ALL[+g];const inRun=!!r.closest('#runner'),inDetail=!!r.closest('#detail');
  if(st==='clear')clearRec(l);else record(l,st);
  if(inRun){refresh('#run-q');const nx=nextLamp();$('#live').textContent=`기록함: ${l.c.q} — ${SN[l.st]}. ${nx?'다음 점검: '+nx.c.q:'체크리스트를 다 채웠다'}`}
  else if(inDetail){refresh();const el=$(`#d-${l.i} [data-rec="${g}:${st==='clear'?'bad':st}"]`)||$(`#d-${l.i} .rec button`);el&&el.focus();$('#live').textContent=`기록함: ${l.c.q} — ${SN[l.st]}`}
  else{const row=r.closest('details.ck'),pane=row&&row.closest('.tabpanel');const rows=pane?$$('#'+pane.id+' details.ck'):[];const nx=rows[rows.indexOf(row)+1];const nk=nx&&nx.dataset.k;
   OPEN.add(l.key);OPENG.add(l.id);refresh();const sel_=k=>pane&&k!=null&&$(`#${pane.id} details[data-k="${k}"] summary`);
   const el=sel_(g)||sel_(nk)||(pane&&$(`#${pane.id} details.ck summary`))||$('#run-q');el&&el.focus();$('#live').textContent=`기록함: ${l.c.q} — ${SN[l.st]}${sel_(g)?'':' · 이 목록에서 빠졌다'}`}
  return}
 const lt=e.target.closest('[data-later]');if(lt){LATER.add(ALL[+lt.dataset.later].key);checkP();$('#run-q').focus();return}
 const bk=e.target.closest('[data-bulk]');if(bk){(lamps[bk.dataset.bulk]||[]).filter(x=>!x.done&&x.auto==='ok').forEach(x=>record(x,'ok'));refresh('#run-q');$('#live').textContent=`${NAME[bk.dataset.bulk]} 자동 정상을 한꺼번에 확인했다`;return}
 const rw=e.target.closest('[data-row]');if(rw){goRow(rw.dataset.row,rw);return}
 const fcd=e.target.closest('[data-fcard]');if(fcd){if(fcd.dataset.fnav!==undefined){fcd.closest('.fmap').querySelectorAll('[data-fnav]').forEach(x=>x.tabIndex=-1);fcd.tabIndex=0}goCard(fcd.dataset.fcard);return}
 const tg=e.target.closest('[data-tabgo]');if(tg){showTab(tg.dataset.tabgo);$('#tab-'+tg.dataset.tabgo).focus();return}
 const op=e.target.closest('[data-open]');if(op){const [k,i]=op.dataset.open.split(':');const t=document.getElementById('n-'+k);pick(k,{from:t,lamp:+i,keep:true});if(!drawer()){t.scrollIntoView({block:'center'});t.focus()}return}
 const fb=e.target.closest('#p-check [data-f]');if(fb){flt=fb.dataset.f;checkP();const nb=$(`#p-check [data-f="${flt}"]`);nb&&nb.focus();return}
 if(e.target.closest('[data-export]')){exportMd();return}
 if(e.target.closest('[data-reset]')){if(confirm('이 실행의 체크리스트 기록을 모두 지울까요?')){REC={};save();LATER.clear();refresh('#run-q')}return}});
document.addEventListener('change',e=>{const m=e.target.closest('[data-memo]');if(!m)return;const l=ALL[+m.dataset.memo];const r=REC[l.key]||{};r.memo=m.value.trim();if(!r.memo&&!r.st)delete REC[l.key];else REC[l.key]=r;l.memo=r.memo||'';save()});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.fother')){FOTHER=d.open;return}if(d.matches&&d.matches('details.grp')&&!STS.includes(flt)){if(d.open)OPENG.add(d.dataset.g);else OPENG.delete(d.dataset.g);return}if(!(d.matches&&d.matches('details.ck')))return;const l=ALL[+d.dataset.k];if(d.open)OPEN.add(l.key);else OPEN.delete(l.key)},true);
function render(){
 $('#title').innerHTML=`ROAS 점검 이력판 · ${esc(R.advertiser)}<span class="ver">v4.1</span>`;
 $('#subtitle').textContent=`메타 · ${R.date} · ${R_==='D'?'데일리 — 같아야 할 값이 그대로인가':'위클리 — 흐름이 어디서 꺾였나'}`;
 document.title=`ROAS 점검 이력판 · ${R.advertiser} · ${R_==='D'?'데일리':'위클리'}`;
 band();grid();detail();traceP();tabs();bindGo('#tabs');
 $('#circ-sub').textContent=R_==='D'?`줄 = 자리, 칸 = 지난 13일(실행한 날만 기호, 빗금 = 실행 없음), 오른쪽 끝 = 이번 점검`:`줄 = 자리, 칸 = 지난 7주(빗금 = 실행 없음), 오른쪽 끝 = 이번 주 점검`;
 $('#circ').addEventListener('keydown',nav);$('#tabs').addEventListener('keydown',fnav);
 }
render();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sel){const o=opener;sel=null;pick(null,{});if(o)o.focus()}});
const setThemeLabel=()=>{const c=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');$('#theme').textContent=c==='dark'?'◐ 밝게':'◐ 어둡게'};
let th=null;try{th=localStorage.getItem('roas-board-theme')}catch(e){}if(th)document.documentElement.setAttribute('data-theme',th);setThemeLabel();
$('#theme').onclick=()=>{const c=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('roas-board-theme',n)}catch(e){}setThemeLabel()};
})();
</script></body></html>
